name: Build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cc65
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cc65
      - name: Build
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: solidcraft64
          path: build/solidcraft.prg
