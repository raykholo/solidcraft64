# The boot loader: loaded at $0801 as a BASIC program, copies itself out of
# the way to $CC00 (the main program is about to load over $0801), then loads
# SC64.BIN through the KERNAL.
MEMORY {
    LOADADDR: file = %O, start = $07FF, size = $0002;
    LOAD:     file = %O, start = $0801, size = $0700;
    RUN:      file = "", start = $CC00, size = $0400;
}
SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    STUB:     load = LOAD,     type = ro;
    CODE:     load = LOAD, run = RUN, type = rw, define = yes;
}
